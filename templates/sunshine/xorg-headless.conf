Section "Device"
    Identifier "SunshineNVIDIA"
    Driver "nvidia"
    BusID "PCI:1:0:0"
    Option "AllowEmptyInitialConfiguration" "True"
    Option "ConnectedMonitor" "DP-0"
    Option "UseEDID" "False"
EndSection

Section "Monitor"
    Identifier "SunshineMonitor"
    HorizSync 30-160
    VertRefresh 24-144
    Modeline "1920x1080_60" 148.50 1920 2008 2052 2200 1080 1084 1089 1125 +HSync +VSync
EndSection

Section "Screen"
    Identifier "SunshineScreen"
    Device "SunshineNVIDIA"
    Monitor "SunshineMonitor"
    DefaultDepth 24
    Option "MetaModes" "DP-0: 1920x1080_60 +0+0"
    Option "ModeValidation" "AllowNonEdidModes,NoDFPNativeResolutionCheck"
    SubSection "Display"
        Depth 24
        Modes "1920x1080_60"
        Virtual 1920 1080
    EndSubSection
EndSection
