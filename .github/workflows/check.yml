name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  instance-tools:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests -v
      - run: python3 -m compileall -q tools tests
      - run: bash -n tools/*.sh templates/sunshine/sunshine-launch
